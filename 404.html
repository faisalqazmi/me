<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Faisal Muzaffar</title>
    <style>
        /* Editorial & Creative Design Variables */
        :root {
            --accent: #7c3aed; 
            --accent-hover: #6d28d9;
            
            --bg: #fdfcfb;
            --surface: #ffffff;
            --text-main: #27272a;
            --text-muted: #71717a;
            --border: #e4e4e7;
            --shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
            
            --font-display: "Playfair Display", ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
            --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: "JetBrains Mono", "Fira Code", monospace;
            
            --transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        [data-theme="dark"] {
            --bg: #18181b; 
            --surface: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: #3f3f46;
            --accent: #a78bfa; 
            --accent-hover: #c4b5fd;
            --shadow: 0 10px 40px -10px rgba(0,0,0,0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-sans);
            line-height: 1.7;
            transition: background-color 0.5s ease, color 0.5s ease;
            overflow-x: hidden;
            cursor: none; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .cursor-dot {
            position: fixed;
            top: 0; left: 0;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
            width: 10px; height: 10px;
            background-color: var(--accent);
            border-radius: 50%;
            transition: width 0.3s, height 0.3s, opacity 0.3s, background-color 0.3s;
        }

        @media (pointer: coarse) {
            body { cursor: auto; }
            .cursor-dot { display: none !important; }
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 2rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2.5rem 0;
            position: relative;
            z-index: 10;
        }

        .logo {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            font-style: italic;
            text-decoration: none;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--accent);
            font-style: normal;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 2.5rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            position: relative;
            transition: color var(--transition);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -4px;
            left: 0;
            background-color: var(--accent);
            transition: width var(--transition);
        }

        .nav-links a:hover { color: var(--accent); }
        .nav-links a:hover::after { width: 100%; }

        .theme-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: none;
            transition: transform var(--transition), color var(--transition);
        }
        
        .theme-btn:hover {
            color: var(--accent);
            transform: rotate(15deg);
        }

        .theme-btn svg { width: 22px; height: 22px; }
        [data-theme="dark"] .sun-icon { display: none; }
        [data-theme="light"] .moon-icon { display: none; }

        /* Error Section */
        .error-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 0;
        }

        .error-code {
            font-family: var(--font-display);
            font-size: clamp(6rem, 15vw, 12rem);
            font-weight: 500;
            line-height: 1;
            color: var(--accent);
            margin-bottom: 1rem;
            font-style: italic;
        }

        .error-section h1 {
            font-family: var(--font-display);
            font-size: 2.5rem;
            font-weight: 500;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .error-section p {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 500px;
            margin-bottom: 3rem;
            font-weight: 300;
        }

        .home-link {
            font-family: var(--font-mono);
            font-size: 0.95rem;
            color: var(--text-main);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            border: 1px solid var(--border);
            border-radius: 50px;
            transition: all var(--transition);
        }

        .home-link:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
            gap: 0.8rem;
        }

        footer {
            padding: 2rem 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-family: var(--font-mono);
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px) scale(0.98);
            filter: blur(4px);
            animation: revealAnim 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes revealAnim {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        @media (max-width: 768px) {
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <div class="cursor-dot" id="cursor-dot"></div>

    <div class="container">
        <nav>
            <a href="/" class="logo">Faisal<span>.</span></a>
            <div class="nav-controls">
                <ul class="nav-links">
                    <li><a href="/#about">About</a></li>
                    <li><a href="/#work">Work</a></li>
                    <li><a href="/#contact">Contact</a></li>
                </ul>
                <button class="theme-btn" id="theme-toggle" aria-label="Toggle Theme">
                    <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </div>
        </nav>

        <main class="error-section reveal">
            <div class="error-code">404</div>
            <h1>Lost in the data.</h1>
            <p>Looks like we can't find that page. It might have moved, or the link might be broken.</p>
            <a href="/" class="home-link">&larr; Back to Base</a>
        </main>

        <footer>
            <p>&copy; <span id="year"></span> Faisal Muzaffar. Crafted with intent.</p>
        </footer>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const themeBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;
        
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            htmlElement.setAttribute('data-theme', savedTheme);
        } else {
            htmlElement.setAttribute('data-theme', 'light');
        }

        themeBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });

        const dot = document.getElementById("cursor-dot");
        let mouseX = window.innerWidth / 2; 
        let mouseY = window.innerHeight / 2;
        let dotX = mouseX; 
        let dotY = mouseY;

        document.addEventListener("mousemove", (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateCursor() {
            dotX += (mouseX - dotX) * 0.15;
            dotY += (mouseY - dotY) * 0.15;
            
            dot.style.transform = `translate(calc(${dotX}px - 50%), calc(${dotY}px - 50%))`;
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        const interactables = document.querySelectorAll('a, button');
        interactables.forEach(el => {
            el.addEventListener('mouseenter', () => {
                dot.style.width = '40px';
                dot.style.height = '40px';
                dot.style.backgroundColor = 'var(--accent)';
                dot.style.opacity = '0.3';
            });
            el.addEventListener('mouseleave', () => {
                dot.style.width = '10px';
                dot.style.height = '10px';
                dot.style.backgroundColor = 'var(--accent)';
                dot.style.opacity = '1';
            });
        });
    </script>
</body>
</html>
